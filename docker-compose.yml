services:
  mongo:
    image: mongo:7
    container_name: songs_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: songs_backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongo:27017/songdb
      - PORT=5000
      - NODE_ENV=production
    ports:
      - '5000:5000'
    depends_on:
      - mongo

volumes:
  mongo_data: